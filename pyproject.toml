[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flip-scout"
version = "0.1.0"
description = "Telegram alert bot for new Vinted listings with AI-powered condition analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "anthropic>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
flip-scout = "flip_scout.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
