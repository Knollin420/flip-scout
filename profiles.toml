# flip-scout – Einstellungen und Profile (Server)
# Nach Änderungen: sudo systemctl restart flip-scout
#
# Suchen selbst verwaltest du per Telegram (Vinted-Link an den Bot schicken, /menu).
# Profile legen fest, WIE eine Anzeige geprüft wird.
# Sicherung der alten Version: data/profiles.toml.bak-2026-11-17

[settings]
domain = "at"                 # vinted.at
interval_minutes = 3          # seit 18.11.2026 (vorher 5); nicht kleiner als 3. Bei Block-Warnung zurück auf 5
max_age_minutes = 60          # Pause länger als das -> zuerst nur den Bestand merken
heartbeat_hour = 9            # tägliche "läuft"-Meldung (Ortszeit)
alarm_after_failed_runs = 3   # "Vinted blockiert evtl."-Alarm
timezone = "Europe/Vienna"
no_feedback_max_price = 50    # Verkäufer ohne Bewertungen: nur Anzeigen bis zu diesem Preis
# Nur Vinted: Bezahlung/Kontakt außerhalb von Vinted (kein Käuferschutz, typischer Betrug).
# Kostenlos in Titel und Beschreibung; "nicht über WhatsApp" o. Ä. zählt nicht.
vinted_exclude_words = [
    # Deutsch
    "nur überweisung", "nur per überweisung", "nur banküberweisung", "nur per banküberweisung",
    "per überweisung statt", "nicht über vinted", "nicht via vinted", "ohne vinted", "außerhalb von vinted",
    "ausserhalb von vinted", "außerhalb vinted", "nicht über die plattform", "paypal freunde",
    "freunde und familie", "whatsapp",
    # Englisch
    "bank transfer only", "only bank transfer", "outside vinted", "outside of vinted", "not through vinted",
    "not via vinted", "paypal friends", "friends and family",
    # Französisch
    "virement uniquement", "uniquement par virement", "uniquement virement", "paiement par virement",
    "virement bancaire", "hors vinted", "en dehors de vinted", "sans passer par vinted", "pas via vinted",
    "pas par vinted", "paypal entre proches",
    # Italienisch
    "solo bonifico", "pagamento con bonifico", "pagamento tramite bonifico", "bonifico bancario",
    "fuori vinted", "fuori da vinted", "al di fuori di vinted", "non tramite vinted", "non su vinted",
    "paypal amici", "amici e parenti",
    # Spanisch / Portugiesisch
    "solo transferencia", "transferencia bancaria", "fuera de vinted", "no por vinted", "bizum",
    "paypal amigos", "só transferência", "transferência bancária", "fora do vinted", "mbway", "mb way",
    # Niederländisch / Polnisch / Tschechisch
    "alleen overboeken", "bankoverschrijving", "buiten vinted", "niet via vinted", "tikkie",
    "tylko przelew", "przelew bankowy", "poza vinted", "nie przez vinted", "pouze převodem", "mimo vinted",
]

# --- willhaben.at (nur Wien, nur Privatanzeigen, alle 3 Minuten) -------------
willhaben_enabled = true
willhaben_area_id = 900               # 900 = Wien
willhaben_interval_minutes = 3
willhaben_private_only = true
willhaben_price_factor = 1.2          # Preisgrenzen +20 %; darüber schlägt die Nachricht dein Limit vor
willhaben_auto_message = true         # automatische Nachricht nach jedem willhaben-Treffer
willhaben_max_messages_per_day = 20   # Sicherheitsgrenze
willhaben_message = """Hallo {name},
ich hätte großes Interesse. Ich wohne auch in der Nähe könnte es also Zeitnah abholen. Wäre das heute oder morgen noch möglich?
vg,
colin"""
willhaben_message_offer = """Hallo {name},
ich hätte großes Interesse. Wäre es für dich noch in Ordnung auf {limit} herunterzugehen? Ich wohne auch in der Nähe könnte es also Zeitnah abholen. Wäre das heute oder morgen noch möglich?
vg,
colin"""
min_price_everywhere = 3      # alle Suchen: Anzeigen unter 3 € sind meist Lockangebote
# Ausschlusswörter für ALLE Suchen (Titel und Beschreibung, kostenlos vor der KI)
exclude_everywhere = [
    "nur vinted go", "nur über vinted go", "nur per vinted go", "nur mit vinted go", "nur vinted-go",
    "uniquement vinted go", "uniquement via vinted go", "uniquement par vinted go", "uniquement vinted-go",
    "seulement vinted go", "seulement via vinted go",
    "solo vinted go", "solo con vinted go", "solo tramite vinted go", "solo via vinted go",
    "only vinted go", "only via vinted go",
]

[ai]
enabled = true
model = "claude-haiku-5-5"
max_images = 3                # Fotos pro Anzeige im Foto-Check
max_checks_per_day = 3000     # Kostenbremse: KI-Aufrufe pro Tag
price_input_per_mtok = 0.10   # nur für die Kostenanzeige in /status (USD)
price_output_per_mtok = 0.50


# ---------------------------------------------------------------------------
# PROFILE
# Felder (alle optional):
#   label, emoji        Anzeige in Telegram
#   exclude             Ausschlusswörter NUR im Titel (Teilwort, z.B. "hülle")
#   exclude_desc        Ausschlusswörter in Titel UND Beschreibung (z.B. "ich suche")
#   require_any         Mindestens EINES muss in Titel oder Beschreibung stehen,
#                       sonst wird die Anzeige ohne KI übersprungen (spart Kosten)
#   must_include        ALLE müssen vorkommen  -> sofort Treffer (ohne KI-Prüfung)
#   any_include         EINES muss vorkommen   -> sofort Treffer (ohne KI-Prüfung)
#   min_price           Mindestpreis in €
#   ai_check            Was die KI prüfen soll. Leer = jede Anzeige, die die Filter
#                       besteht, ist ein Treffer.
#   briefing            KI-Kurzbriefing mit Fotos bei Treffern (Standard: true)
#   ok_defects          Defekte, die okay sind (leer = Zustand egal)
#   no_go               Ausschlussgründe (leer = keine)
#   check_icloud        iCloud-/Aktivierungssperre ist ein Ausschluss
#   max_prices          Höchstpreis pro Modell. Die KI ordnet exakt einem Schlüssel zu.
#                       Hat die Suche keinen eigenen Höchstpreis, gilt: Vinted wird nur
#                       bis zum höchsten Tabellenpreis abgefragt, und Modelle, die nicht
#                       in der Tabelle stehen, werden nie gemeldet.
# ---------------------------------------------------------------------------

