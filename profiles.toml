dann modell_key 'keins'. Jeder Riegel muss mindestens 8 GB haben. Die Anzahl der Riegel aus Text
und Fotos bestimmen; ist sie nicht erkennbar, gilt die genannte Kapazität als ein Riegel/Kit.
Den Typ bestimmen: Text ('DDR4', 'PC4-2133/2400/2666/3200') und Etikett auf den Fotos
('PC4-...' = DDR4, 'PC3-...' = DDR3, 'PC5-...' = DDR5). Steht der Typ nicht eindeutig im Text
und sind noch keine Fotos da: passt = 'unklar' und modell_key = 'keins'. Nur wenn DDR4 sicher
ist, einen DDR4-Schlüssel wählen. Andere Kapazitäten (z.B. 4 GB, 64 GB) haben modell_key 'keins'.
WICHTIG: Der Schlüssel hängt NUR von Typ (DDR4) und Gesamtkapazität ab. Ob Einzelriegel oder Kit,
Desktop oder Laptop (SO-DIMM), Takt und Marke sind egal. Stehen DDR4 und die Kapazität im Text,
wähle den passenden Schlüssel sofort, auch ohne Fotos. Ist nur unklar, ob '16 GB' ein Riegel oder
die Summe eines Kits ist, nimm die genannte Zahl als Gesamtkapazität.
Kein RAM in einem Gerät verbaut, keine Suchanzeige."""
