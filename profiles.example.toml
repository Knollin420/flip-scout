# ---------------------------------------------------------------------------
# START-SUCHEN (optional)
# Werden beim ersten Start einmalig in die Datenbank übernommen (wenn es noch
# keine Suche mit diesem Namen gibt). Danach verwaltest du alles per Telegram.
#   url    = Browser-Link von vinted.at (Filter wie Kategorie, Marke, Zustand)
#   terms  = zusätzliche Suchbegriffe mit denselben Filtern
# ---------------------------------------------------------------------------

[[search]]
name = "iPhone defekt"
profile = "iphone_defekt"
terms = ["iphone defekt", "iphone display kaputt", "iphone bastler", "iphone displayschaden"]
max_price = 450

[[search]]
name = "MacBook defekt"
profile = "macbook_defekt"
terms = ["macbook defekt", "macbook display kaputt", "macbook bastler", "macbook wasserschaden"]
max_price = 650

[[search]]
name = "Switch OLED"
profile = "standard"
terms = ["switch oled"]
max_price = 180
min_price = 80
