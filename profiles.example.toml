[profile.macbook_defekt]
label = "MacBook defekt"
emoji = "💻"
min_price = 50
exclude = ["hülle", "case", "sleeve", "tasche", "netzteil", "ladekabel", "folie", "skin", "tastaturabdeckung", "keyboard cover"]
