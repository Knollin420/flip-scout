# flip-scout – Einstellungen und Profile
# Kopieren nach profiles.toml und anpassen. Nach Änderungen: Bot neu starten
# (pkill -f flip_scout – die Startschleife startet ihn automatisch neu).
#
# Suchen selbst verwaltest du per Telegram (Vinted-Link an den Bot schicken).
# Profile legen fest, WIE eine Anzeige geprüft wird.

[settings]
domain = "at"                 # vinted.at
interval_minutes = 5          # nicht kleiner als 5 (Bot-Schutz)
max_age_minutes = 60          # ältere Anzeigen werden ignoriert
heartbeat_hour = 9            # tägliche "läuft"-Meldung (Ortszeit)
alarm_after_failed_runs = 3   # "Vinted blockiert evtl."-Alarm
timezone = "Europe/Vienna"

[ai]
enabled = true
model = "claude-haiku-5-5"
max_images = 3                # Fotos pro Anzeige im Foto-Check (volle Auflösung)
max_checks_per_day = 3000     # Kostenbremse: KI-Aufrufe pro Tag
price_input_per_mtok = 0.10   # nur für die Kostenanzeige in /status (USD)
price_output_per_mtok = 0.50


# ---------------------------------------------------------------------------
# PROFILE
# Felder (alle optional):
#   label, emoji        Anzeige in Telegram
#   exclude             Ausschlusswörter NUR im Titel (Teilwort, z.B. "hülle")
#   exclude_desc        Ausschlusswörter in Titel UND Beschreibung (z.B. "ich suche").
#                       Vorsicht: "inkl. Hülle" steht oft in guten Angeboten!
#   must_include        ALLE müssen vorkommen  -> sofort Treffer
#   any_include         EINES muss vorkommen   -> sofort Treffer
#   min_price           Mindestpreis in €
#   ai_check            Was die KI prüfen soll, wenn keine Stichwörter passen.
#                       Leer = jede Anzeige, die die Filter besteht, ist ein Treffer.
#   briefing            KI-Kurzbriefing mit Fotos bei Treffern (Standard: true)
#   ok_defects          Defekte, die okay sind
#   no_go               Ausschlussgründe (nur wenn klar erkennbar)
#   check_icloud        iCloud-/Aktivierungssperre prüfen
#   max_prices          Höchstpreis pro Modell. Die KI ordnet exakt einem Schlüssel zu.
#                       Modell nicht in der Tabelle -> nur Treffer, wenn die Suche
#                       einen Höchstpreis hat.
# ---------------------------------------------------------------------------

[profile.standard]
label = "Normal"
emoji = "🛍"
exclude = ["hülle", "case", "tasche", "nur ovp", "leere ovp", "ovp leer", "nur karton", "defekt", "kaputt", "bastler", "ersatzteil"]
exclude_desc = ["ich suche", "nur tausch", "nur karton", "nur die ovp"]
briefing = true

[profile.iphone_defekt]
label = "iPhone defekt"
emoji = "📱"
min_price = 30
exclude = ["hülle", "case", "panzerglas", "schutzglas", "ladekabel", "netzteil", "nur gehäuse", "leergehäuse", "backcover", "akku für"]
exclude_desc = ["ich suche", "attrappe", "dummy", "nur tausch"]
any_include = []
ai_check = "Defektes oder beschädigtes Apple iPhone zum Reparieren und Weiterverkaufen. Nur echte Geräte, kein Zubehör, keine Einzelteile."
ok_defects = ["Display gesprungen", "Display/Touch defekt", "Rückglas gesprungen", "Akku schwach/defekt", "Kamera defekt", "Kameraglas gesprungen", "Kratzer", "Dellen am Rahmen", "Lautsprecher/Mikrofon defekt", "Ladebuchse defekt"]
no_go = ["Wasserschaden", "Board-/Platinendefekt", "geht nicht an / kein Bild und keine Reaktion", "Face ID defekt", "ausgeschlachtet / Teile fehlen", "Bootloop", "nur Teile / Gehäuse"]
check_icloud = true

